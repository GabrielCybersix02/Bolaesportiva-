<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Fruity Jackpot • Bola Esportiva</title><meta name="theme-color" content="#2b0b5e">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%}body{font-family:Inter,system-ui,sans-serif;color:#fff;background:radial-gradient(120% 60% at 50% 0,#6d2bd6,#3a0f86 45%,#1c0845);display:flex;justify-content:center}
.app{width:100%;max-width:430px;min-height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 12px}.top a{color:#fff;text-decoration:none;font-size:22px;font-weight:800}
.pill{background:#fff;color:#2b0b5e;font-weight:800;font-size:13px;padding:7px 16px;border-radius:99px}
.jp{display:grid;grid-template-columns:1fr 1.25fr 1fr;grid-template-rows:auto auto;gap:6px 8px;padding:6px 14px 10px;align-items:center}
.pl{border-radius:12px;text-align:center;padding:5px 4px 4px;border:2px solid;font-weight:900;line-height:1.1;box-shadow:inset 0 0 12px #0008,0 4px 10px -4px #000}
.pl b{display:block;font-size:11px;letter-spacing:.5px}.pl span{font-size:13px;color:#fff}.pl small{display:block;font-size:9px;opacity:.8;margin-top:1px}
.pl.g{background:#0a5a2a;border-color:#4ade80}.pl.g b{color:#bbf7d0}.pl.s{background:linear-gradient(#b91c1c,#7f1d1d);border-color:#fcd34d;padding:8px 4px}.pl.s b{color:#fde68a;font-size:13px}.pl.s span{font-size:17px}
.pl.m{background:#9a3412;border-color:#fb923c}.pl.m b{color:#fed7aa}.pl.n{background:#9d174d;border-color:#f472b6}.pl.n b{color:#fbcfe8}.pl.i{background:#1e3a8a;border-color:#60a5fa}.pl.i b{color:#bfdbfe}
.pl.hit{animation:hit .5s infinite alternate}@keyframes hit{to{transform:scale(1.08);box-shadow:0 0 22px #ffd84a}}
.logo{font-family:'Lilita One',Impact,sans-serif;text-align:center;color:#ffd84a;font-size:24px;line-height:.95;-webkit-text-stroke:1.5px #8a2d00;paint-order:stroke fill;text-shadow:0 3px 0 #8a2d00;transform:rotate(-3deg)}
.board{margin:0 8px;border:4px solid;border-image:linear-gradient(#fcd34d,#b45309) 1;background:#f3ead1;display:grid;grid-template-columns:repeat(6,1fr);position:relative;overflow:hidden;border-radius:6px}
.col{display:grid;grid-template-rows:repeat(5,1fr);border-right:1px solid #c9bb92;overflow:hidden}.col:last-child{border:0}
.cell{aspect-ratio:1;display:grid;place-items:center;font-size:clamp(26px,8.6vw,38px);line-height:1;border-bottom:1px solid #d8cba3;transition:.2s}.col .cell:last-child{border:0}
.col.spin .cell{animation:fall .12s linear infinite;filter:blur(1.2px)}@keyframes fall{from{transform:translateY(-35%)}to{transform:translateY(35%)}}
.col.land .cell{animation:land .28s ease-out}@keyframes land{0%{transform:translateY(-60%)}60%{transform:translateY(6%)}100%{transform:none}}
.board.hasw .cell{opacity:.35}.board.hasw .cell.win{opacity:1;animation:pulse .5s infinite alternate;z-index:2;background:#fff3b0}.cell.win{box-shadow:0 0 14px #f59e0b inset}@keyframes pulse{to{transform:scale(1.12)}}
.s7{font-family:'Lilita One',Impact,sans-serif;font-size:1.25em;color:#dc2626;-webkit-text-stroke:2px #fbbf24;paint-order:stroke fill;text-shadow:0 2px 0 #7f1d1d}
.bar{display:flex;flex-direction:column;gap:1px;background:linear-gradient(#fcd34d,#b45309);padding:3px;border-radius:5px;border:1.5px solid #78350f}.bar i{font-style:normal;font-size:.28em;font-weight:900;color:#7f1d1d;background:#fde68a;border-radius:2px;padding:0 4px;text-align:center;letter-spacing:.5px;line-height:1.25}
.msg{margin:0;background:linear-gradient(90deg,#4c1d95,#7c3aed,#4c1d95);text-align:center;padding:9px 6px;font-weight:900;font-size:17px;color:#fde68a;text-shadow:0 2px 0 #3b0764;min-height:42px;border-top:2px solid #c4b5fd55;border-bottom:2px solid #c4b5fd55}
.ctl{flex:1;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(#2b0b5e00,#12062f);padding:10px 14px 4px}
.spinrow{display:flex;justify-content:center;align-items:center;gap:20px;margin-bottom:12px}
.rb{width:44px;height:44px;border-radius:50%;border:0;background:#1f1245;color:#fff;font-size:26px;font-weight:900;box-shadow:inset 0 0 0 2px #6b4bb8}
.go{width:92px;height:92px;border-radius:50%;border:5px solid #c4b5fd;background:radial-gradient(circle at 35% 30%,#8b5cf6,#4c1d95);color:#fff;font-size:46px;box-shadow:0 0 0 3px #1f1245,0 8px 20px #000a;transition:transform .2s}
.go:active{transform:scale(.94)}.go.run{animation:rot 1s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}.go:disabled{opacity:.7}
.icons{display:flex;justify-content:space-around;margin-bottom:8px}.ib{width:54px;height:36px;border-radius:99px;border:0;background:#1f1245;color:#fff;font-size:17px;box-shadow:inset 0 0 0 1.5px #6b4bb8}.ib.on{background:#7c3aed}
.info{text-align:center;font-weight:900;font-size:16px;color:#fcd34d;padding:6px 0 10px}.info b{color:#fff}.err{color:#fca5a5;text-align:center;font-size:12px;font-weight:700;min-height:16px}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.on{display:flex}
.sheet{background:#241346;width:100%;max-width:430px;max-height:80vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px;font-size:13px}
.sheet h3{margin:0 0 8px;color:#fcd34d}.pr{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #ffffff14}.pr .sy{width:34px;text-align:center;font-size:24px}.pr .v{flex:1;display:grid;grid-template-columns:repeat(4,1fr);text-align:center;font-weight:700}
.pr .v small{display:block;font-size:9px;opacity:.6}.sheet p{opacity:.75;line-height:1.4;margin:8px 0}.x{float:right;background:#ffffff1a;border:0;color:#fff;border-radius:99px;width:30px;height:30px}
</style></head><body><div class="app">
<div class="top"><a href="/slots">‹</a><div class="pill" id="saldoTop">R$ 0,00</div><a href="#" onclick="showInfo();return false" style="font-size:18px">ⓘ</a></div>
<div class="jp" id="jp"></div>
<div class="board" id="board"></div>
<div class="msg" id="msg">FAÇA AS SUAS APOSTAS!</div>
<div class="ctl"><div class="err" id="err"></div>
 <div class="spinrow"><button class="rb" onclick="step(-1)">−</button><button class="go" id="go" onclick="spin()">↻</button><button class="rb" onclick="step(1)">+</button></div>
 <div class="icons"><button class="ib" onclick="showInfo()">i</button><button class="ib" id="bAuto" onclick="toggleAuto()">⟳ Auto</button><button class="ib" id="bTurbo" onclick="turbo=!turbo;this.classList.toggle('on',turbo)">⚡</button></div>
 <div class="info">CRÉDITO <b id="cred">R$ 0,00</b> &nbsp; APOSTA <b id="apo">R$ 1,00</b></div></div>
</div>
<div class="modal" id="modal" onclick="if(event.target===this)this.classList.remove('on')"><div class="sheet" id="sheet"></div></div>
<script>
const $=i=>document.getElementById(i),money=v=>'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const SYM=['limao','melancia','laranja','uva','sino','sete','bar','coroa'],EM={limao:'🍋',melancia:'🍉',laranja:'🍊',uva:'🍇',sino:'🔔',coroa:'👑'};
const sym=k=>k==='sete'?'<span class="s7">7</span>':k==='bar'?'<span class="bar"><i>BAR</i><i>BAR</i><i>BAR</i></span>':EM[k];
let I,BETS=[],bi=0,busy=false,auto=false,turbo=false,saldo=0,grid=[];
const bet=()=>BETS[bi];
async function api(p,b){const r=await fetch(p,b===undefined?{credentials:'same-origin'}:{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(r.status===401){location.href='/';return{ok:false}}return r.json()}
function drawJP(hit){const j=Object.fromEntries(I.jackpots.map(x=>[x.nome,x])),pl=(n,c,l)=>`<div class="pl ${c} ${hit===n?'hit':''}"><b>${l||n}</b><span>${money(j[n].mult*bet())}</span><small>👑 ×${j[n].coroas}</small></div>`;
 $('jp').innerHTML=pl('GRAND','g')+pl('SUPER GRAND','s','SUPER GRAND')+pl('MAJOR','m')+pl('MINOR','n')+'<div class="logo">Fruity<br>Jackpot</div>'+pl('MINI','i')}
function drawBoard(g,wins){$('board').className='board'+(wins?' hasw':'');$('board').innerHTML=g.map((col,c)=>`<div class="col" id="c${c}">${col.map((s,r)=>`<div class="cell ${wins&&wins.has(s)?'win':''}">${sym(s)}</div>`).join('')}</div>`).join('')}
function rnd(){return SYM[Math.floor(Math.random()*7)]}
function refresh(){$('saldoTop').textContent=money(saldo);$('cred').textContent=money(saldo);$('apo').textContent=money(bet());drawJP()}
function step(d){if(busy)return;bi=Math.min(BETS.length-1,Math.max(0,bi+d));refresh()}
function toggleAuto(){auto=!auto;$('bAuto').classList.toggle('on',auto);if(auto&&!busy)spin()}
async function spin(){if(busy)return;busy=true;$('go').disabled=true;$('go').classList.add('run');$('err').textContent='';$('msg').textContent='BOA SORTE!';drawBoard(grid);drawJP();
 const cols=[...Array(6).keys()],tm=cols.map(c=>{$('c'+c).classList.add('spin');return setInterval(()=>{document.querySelectorAll('#c'+c+' .cell').forEach(e=>e.innerHTML=sym(rnd()))},70)});
 const [res]=await Promise.all([api('/api/slots/jackpot/spin',{valor:bet()}),sleep(turbo?350:800)]);
 if(!res.ok){tm.forEach(clearInterval);cols.forEach(c=>$('c'+c).classList.remove('spin'));$('err').textContent=res.msg||'Erro.';$('msg').textContent='FAÇA AS SUAS APOSTAS!';auto=false;$('bAuto').classList.remove('on');end();return}
 grid=res.grid;saldo=res.saldo-res.premio;
 for(const c of cols){await sleep(turbo?60:230);clearInterval(tm[c]);const el=$('c'+c);el.classList.remove('spin');el.classList.add('land');el.querySelectorAll('.cell').forEach((e,r)=>e.innerHTML=sym(grid[c][r]))}
 const w=new Set(res.vitorias.map(v=>v.simbolo));if(res.jackpot)w.add('coroa');drawBoard(grid,w.size?w:null);
 $('msg').textContent=res.jackpot?'🎉 JACKPOT '+res.jackpot.nome+'! '+money(res.premio):res.premio>0?'GANHOU '+money(res.premio)+'!':'FAÇA AS SUAS APOSTAS!';if(res.jackpot)drawJP(res.jackpot.nome);
 saldo=res.saldo;$('saldoTop').textContent=money(saldo);$('cred').textContent=money(saldo);
 await sleep(res.premio>0?(turbo?600:1400):(turbo?100:300));end()}
function end(){busy=false;$('go').disabled=false;$('go').classList.remove('run');if(auto)spin()}
function showInfo(){const n=t=>Number(t).toLocaleString('pt-BR');$('sheet').innerHTML=`<button class="x" onclick="modal.classList.remove('on')">✕</button><h3>Tabela de prêmios</h3><p>Junte <b>8 ou mais</b> símbolos iguais em qualquer lugar da tela. O prêmio multiplica a aposta total.</p>`+
 Object.entries(I.pay).reverse().map(([k,v])=>`<div class="pr"><div class="sy">${sym(k)}</div><div class="v">${v.map((m,i)=>`<div><small>${['8-9','10-11','12-14','15+'][i]}</small>${n(m)}x</div>`).join('')}</div></div>`).join('')+
 `<h3 style="margin-top:14px">👑 Jackpots</h3>`+I.jackpots.map(j=>`<div class="pr"><div style="flex:1;font-weight:800">${j.nome}</div><div>${j.coroas}${j.coroas===8?'+':''} coroas</div><b style="width:70px;text-align:right">${n(j.mult)}x</b></div>`).join('')+
 `<p>Retorno teórico ao jogador: ${String(I.rtp).replace('.',',')}%. Prêmio máximo limitado pela casa. Jogue com responsabilidade — +18.</p>`;$('modal').classList.add('on')}
(async()=>{I=await api('/api/slots/jackpot/info');if(!I.ok)return;saldo=I.saldo;BETS=[1,2,5,10,20,50,100].filter(v=>v>=I.min&&v<=I.max);
 grid=Array.from({length:I.cols},()=>Array.from({length:I.rows},rnd));drawBoard(grid);refresh()})();
</script></body></html>
