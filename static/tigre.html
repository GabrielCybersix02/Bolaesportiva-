<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Tigre Dourado • Bola Esportiva</title><meta name="theme-color" content="#8a1a22">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;min-height:100%}body{font-family:Inter,system-ui,sans-serif;color:#fff;display:flex;justify-content:center;background:#8a1a22;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;background:
 radial-gradient(circle at 12% 18%,#ffb6cf 0 16px,transparent 17px),radial-gradient(circle at 88% 30%,#ffb6cf 0 22px,transparent 23px),radial-gradient(circle at 80% 8%,#ff9fbf 0 12px,transparent 13px),radial-gradient(circle at 20% 55%,#ffc2d6 0 20px,transparent 21px),radial-gradient(circle at 74% 62%,#ffb0c8 0 14px,transparent 15px),
 repeating-linear-gradient(90deg,#0000 0 38px,#7a121a55 38px 40px),repeating-linear-gradient(0deg,#0000 0 28px,#7a121a55 28px 30px),
 linear-gradient(#58a8ec 0,#a9cdf2 12%,#e8a1a1 22%,#c0282f 23%,#9b1c24 60%,#6e6e7c 61%,#4c4c58 100%);filter:saturate(1.05)}
.app{position:relative;z-index:1;width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding-top:env(safe-area-inset-top,0px)}
.bar{width:100%;display:flex;justify-content:space-between;align-items:center;padding:8px 10px;position:relative;z-index:6}.bar a{color:#fff;text-decoration:none;font-size:24px;font-weight:800;text-shadow:0 2px 4px #0008}.pill{background:#0006;border-radius:99px;padding:7px 14px;font-size:12px;font-weight:800;color:#fff;text-decoration:none}
.top{position:relative;width:100%;height:150px;margin-top:-2px}.top .roof{position:absolute;bottom:0;left:2%;width:96%;height:78px}.top .mascot{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);width:128px;height:128px;filter:drop-shadow(0 6px 6px #0007);animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateX(-50%) translateY(-4px)}}
.frame{width:96%;position:relative;background:linear-gradient(#ffe27a,#d4932a 45%,#8f5a12);padding:7px;border-radius:5px;display:flex;gap:4px;box-shadow:0 10px 20px -8px #000}
.pil{width:24px;background:linear-gradient(90deg,#8e1119,#e0272f 50%,#8e1119);border-radius:3px;display:flex;flex-direction:column;justify-content:space-around;align-items:center;border:1px solid #5b0a10}
.pil span{width:18px;height:18px;border-radius:50%;background:radial-gradient(#fff3b0,#e7a62a);color:#7a1018;font-size:11px;font-weight:900;display:grid;place-items:center;opacity:.6;transition:.2s}.pil span.on{opacity:1;box-shadow:0 0 10px #fff;transform:scale(1.25)}.pil i{width:10px;height:10px;border-radius:50%;background:#fcd34d44}
.reels{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:#6b2a0a;padding:3px;border-radius:3px}
.col{display:grid;grid-template-rows:repeat(3,1fr);gap:3px;overflow:hidden}.cell{aspect-ratio:1;background:linear-gradient(#f6e9cc,#e9d3a2);display:grid;place-items:center;position:relative;transition:.2s;box-shadow:inset 0 0 12px #b0895033}.cell svg{width:84%;height:84%;overflow:visible}
.col.spin .cell{animation:fall .11s linear infinite;filter:blur(1.5px)}@keyframes fall{from{transform:translateY(-40%)}to{transform:translateY(40%)}}
.col.land .cell{animation:land .26s ease-out}@keyframes land{0%{transform:translateY(-70%)}60%{transform:translateY(7%)}100%{transform:none}}
.reels.hasw .cell{opacity:.4}.reels.hasw .cell.win{opacity:1;background:linear-gradient(#fffbd0,#fcd34d);box-shadow:inset 0 0 0 3px #f59e0b,0 0 16px #fbbf24;animation:pulse .5s infinite alternate;z-index:2}@keyframes pulse{to{transform:scale(1.07)}}
.cell em{position:absolute;bottom:2px;font-style:normal;font-family:'Lilita One',Impact,sans-serif;font-size:14px;letter-spacing:.5px;background:linear-gradient(#f0383f,#9b1119);color:#ffe8a0;padding:0 10px;border-radius:5px;border:2px solid #ffd45a;text-shadow:0 1px 0 #5b0a10}
.panel{width:100%;margin-top:10px;flex:1;background:linear-gradient(#c3202a,#8e1119 40%,#5e0a10);border-top:4px solid #ffd45a;padding:12px 10px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 20px #0006;display:flex;flex-direction:column;align-items:center}
.msg{width:100%;border:3px solid #ffd45a;border-radius:10px;background:linear-gradient(#a8161e,#7a0e15);text-align:center;padding:9px 6px;font-weight:900;color:#c7f9a8;font-size:16px;text-shadow:0 2px 0 #3d0508;min-height:44px;box-shadow:inset 0 0 0 2px #5b0a10}
.info{width:100%;display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:6px;margin-top:9px}.info div{background:#5e0a10;border:2px solid #ffd45a;border-radius:9px;padding:4px 6px 4px 30px;font-weight:900;font-size:13px;position:relative;text-align:center;line-height:1.1;display:flex;flex-direction:column;justify-content:center;min-height:38px}
.info b{position:absolute;left:-6px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:radial-gradient(#fff3b0,#e0a020);border:2px solid #8f5a12;color:#7a1018;display:grid;place-items:center;font-size:13px}.info small{font-size:8px;color:#ffd45a;font-weight:700;letter-spacing:.5px}
.err{color:#fecaca;font-size:12px;font-weight:700;min-height:16px;text-align:center;margin-top:5px}
.ctl{width:100%;display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:4px}
.st{display:flex;flex-direction:column;gap:6px}.sb{width:46px;height:46px;border-radius:50%;border:3px solid #ffd45a;background:radial-gradient(#b3202a,#6e0e15);color:#ffe8a0;font-size:20px;font-weight:900;box-shadow:0 3px 6px #0007;position:relative}.sb small{position:absolute;bottom:-13px;left:0;right:0;font-size:8px;color:#ffd45a;font-weight:800}.sb.on{background:radial-gradient(#4ade80,#15803d);color:#fff}.sb.sm{width:38px;height:38px;font-size:16px}
.pm{width:44px;height:44px;border-radius:50%;border:2px solid #ffd45a88;background:#5e0a10;color:#ffd45a;font-size:26px;font-weight:900;line-height:1}
.go{width:104px;height:104px;border-radius:50%;border:0;padding:0;background:radial-gradient(circle at 50% 50%,#2aa86a 0 52%,#ffd45a 53% 62%,#b8791a 63% 68%,#6e0e15 69%);box-shadow:0 8px 18px #000a;position:relative;transition:transform .15s}.go:active{transform:scale(.93)}.go svg{width:100%;height:100%}.go.run svg{animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}.go:disabled{opacity:.8}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.on{display:flex}.sheet{background:#3b0a0a;border-top:3px solid #ffd45a;width:100%;max-width:430px;max-height:80vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px;font-size:13px}
.sheet h3{margin:0 0 8px;color:#ffd45a}.pr{display:flex;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid #ffffff18}.pr svg{width:46px;height:46px}.pr b{margin-left:auto;font-size:15px}.x{float:right;background:#ffffff22;border:0;color:#fff;border-radius:99px;width:30px;height:30px}.sheet p{opacity:.8;line-height:1.4;font-size:12px}
</style></head><body><div class="bg"></div>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="gG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3a0"/><stop offset=".5" stop-color="#f5b82e"/><stop offset="1" stop-color="#b9740f"/></linearGradient>
<linearGradient id="gR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4a4f"/><stop offset="1" stop-color="#a50f1a"/></linearGradient>
<radialGradient id="gO" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffc062"/><stop offset=".6" stop-color="#ff7a00"/><stop offset="1" stop-color="#c24a00"/></radialGradient>
<linearGradient id="gP" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#4c1d95"/></linearGradient>
<linearGradient id="gJ" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7dffb0"/><stop offset="1" stop-color="#0f8a4a"/></linearGradient>
<linearGradient id="gT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#f0700a"/></linearGradient>
<pattern id="tile" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#13a14f"/><path d="M0 14 Q7 4 14 14" fill="none" stroke="#0a6b33" stroke-width="2"/></pattern>
</defs></svg>
<div class="app">
<div class="bar"><a href="/slots">‹</a><div class="pill">🐯 Tigre Dourado</div><a href="/carteira" class="pill">+ Depositar</a></div>
<div class="top"><svg class="roof" viewBox="0 0 400 80" preserveAspectRatio="none"><path d="M0 80 C50 22 130 6 200 6 C270 6 350 22 400 80Z" fill="url(#tile)" stroke="#ffd45a" stroke-width="5"/><path d="M0 80 C50 28 130 14 200 14 C270 14 350 28 400 80" fill="none" stroke="#ffd45a" stroke-width="2" opacity=".6"/></svg><div class="mascot" id="mascot"></div></div>
<div class="frame"><div class="pil"><span>1</span><span>2</span><span>3</span></div><div class="reels" id="reels"></div><div class="pil"><span>4</span><span>5</span><i></i></div></div>
<div class="panel">
 <div class="msg" id="msg">Faça sua aposta, Tigre Dourado!</div>
 <div class="info"><div><b>$</b><small>CRÉDITO</small><span id="cred">R$ 0,00</span></div><div><b>×</b><small>APOSTA</small><span id="apo">R$ 0,00</span></div><div><b>★</b><small>GANHO</small><span id="ganho">R$ 0,00</span></div></div>
 <div class="err" id="err"></div>
 <div class="ctl"><div class="st"><button class="sb sm" id="bT" onclick="turbo=!turbo;this.classList.toggle('on',turbo)">⚡<small>TURBO</small></button><button class="sb sm" id="bA" onclick="toggleAuto()" style="margin-top:6px">⟳<small>AUTO</small></button></div>
  <button class="pm" onclick="step(-1)">−</button>
  <button class="go" id="go" onclick="spin()"><svg viewBox="0 0 100 100"><path d="M50 26a24 24 0 1 0 22 14" fill="none" stroke="#e9fff1" stroke-width="7" stroke-linecap="round"/><path d="M52 14l-4 15 15-3z" fill="#e9fff1"/></svg></button>
  <button class="pm" onclick="step(1)">+</button><button class="sb sm" onclick="showInfo()">☰<small>MENU</small></button></div>
</div></div>
<div class="modal" id="modal" onclick="if(event.target===this)this.classList.remove('on')"><div class="sheet" id="sheet"></div></div>
<script>
const $=i=>document.getElementById(i),money=v=>'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const V=b=>`<svg viewBox="0 0 100 100">${b}</svg>`;
const TIGER=`<ellipse cx="22" cy="26" rx="13" ry="13" fill="url(#gT)" stroke="#8a3a00" stroke-width="2"/><ellipse cx="22" cy="27" rx="6" ry="6" fill="#ffe3c2"/><ellipse cx="78" cy="26" rx="13" ry="13" fill="url(#gT)" stroke="#8a3a00" stroke-width="2"/><ellipse cx="78" cy="27" rx="6" ry="6" fill="#ffe3c2"/>
<ellipse cx="50" cy="52" rx="40" ry="36" fill="url(#gT)" stroke="#8a3a00" stroke-width="2.5"/>
<path d="M50 18v14M40 20l3 12M60 20l-3 12M12 48l14 3M12 58l14 0M88 48l-14 3M88 58l-14 0" stroke="#5a2300" stroke-width="4" stroke-linecap="round"/>
<ellipse cx="50" cy="68" rx="24" ry="18" fill="#fff6e6" stroke="#8a3a00" stroke-width="2"/>
<ellipse cx="34" cy="48" rx="8" ry="9" fill="#fff"/><ellipse cx="66" cy="48" rx="8" ry="9" fill="#fff"/><circle cx="35" cy="49" r="5" fill="#2a1200"/><circle cx="65" cy="49" r="5" fill="#2a1200"/><circle cx="37" cy="47" r="1.8" fill="#fff"/><circle cx="67" cy="47" r="1.8" fill="#fff"/>
<path d="M24 38q10-8 20-2M76 38q-10-8-20-2" stroke="#5a2300" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<path d="M43 58q7-5 14 0l-7 8z" fill="#f08080" stroke="#8a3a00" stroke-width="1.5"/><path d="M50 66v6M36 72q14 14 28 0" fill="#c2242b" stroke="#5a2300" stroke-width="2.2" stroke-linejoin="round"/>`;
const HAT=`<path d="M22 22Q50-6 78 22L72 30H28Z" fill="url(#gR)" stroke="#7a0e15" stroke-width="2"/><rect x="26" y="26" width="48" height="6" rx="3" fill="url(#gG)"/><circle cx="50" cy="6" r="5" fill="url(#gG)"/>`;
const SV={
 moeda:V(`<circle cx="50" cy="50" r="38" fill="url(#gG)" stroke="#8a5a0a" stroke-width="3"/><circle cx="50" cy="50" r="30" fill="none" stroke="#b9740f" stroke-width="2.5"/><rect x="38" y="38" width="24" height="24" rx="2" fill="#7a3f00" stroke="#8a5a0a" stroke-width="2.5"/><path d="M24 36q10-16 28-14" stroke="#fff8c0" stroke-width="4" fill="none" stroke-linecap="round" opacity=".8"/>`),
 tangerina:V(`<circle cx="50" cy="56" r="34" fill="url(#gO)" stroke="#a63c00" stroke-width="2.5"/><path d="M50 24c4-10 16-12 22-8-2 9-12 14-22 8z" fill="#22a447" stroke="#136b2b" stroke-width="2"/><path d="M50 24v-6" stroke="#6b4a1e" stroke-width="3" stroke-linecap="round"/><ellipse cx="38" cy="44" rx="9" ry="5" transform="rotate(-35 38 44)" fill="#fff" opacity=".45"/><g fill="#d85c00" opacity=".55"><circle cx="60" cy="60" r="1.6"/><circle cx="52" cy="72" r="1.6"/><circle cx="66" cy="48" r="1.6"/><circle cx="42" cy="66" r="1.6"/></g>`),
 lanterna:V(`<path d="M50 4v10" stroke="#ffd45a" stroke-width="3"/><rect x="34" y="12" width="32" height="9" rx="3" fill="url(#gG)" stroke="#8a5a0a" stroke-width="1.5"/><ellipse cx="50" cy="48" rx="30" ry="28" fill="url(#gR)" stroke="#7a0e15" stroke-width="2.5"/><path d="M50 20v56M36 22q-12 26 0 52M64 22q12 26 0 52" stroke="#ffb3a0" stroke-width="2" fill="none" opacity=".7"/><rect x="34" y="74" width="32" height="9" rx="3" fill="url(#gG)" stroke="#8a5a0a" stroke-width="1.5"/><path d="M50 83v12M44 83v9M56 83v9" stroke="#ffd45a" stroke-width="3" stroke-linecap="round"/>`),
 bombinha:V(`<path d="M50 4v14" stroke="#8a5a0a" stroke-width="3"/><circle cx="50" cy="20" r="6" fill="#2563eb" stroke="#1e3a8a" stroke-width="2"/><g stroke="#7a0e15" stroke-width="2"><rect x="22" y="26" width="16" height="56" rx="5" fill="url(#gR)" transform="rotate(-10 30 54)"/><rect x="42" y="26" width="16" height="62" rx="5" fill="url(#gR)"/><rect x="62" y="26" width="16" height="56" rx="5" fill="url(#gR)" transform="rotate(10 70 54)"/></g><g fill="url(#gG)"><rect x="42" y="40" width="16" height="7"/><rect x="42" y="66" width="16" height="7"/></g><path d="M50 88l-5 10M50 88l5 10" stroke="#ffd45a" stroke-width="3" stroke-linecap="round"/>`),
 envelope:V(`<rect x="22" y="8" width="56" height="84" rx="7" fill="url(#gR)" stroke="#ffd45a" stroke-width="3.5"/><path d="M22 34q28 22 56 0" fill="#c11a24" stroke="#ffd45a" stroke-width="2.5"/><circle cx="50" cy="56" r="17" fill="url(#gG)" stroke="#8a5a0a" stroke-width="2"/><text x="50" y="64" text-anchor="middle" font-size="22" font-weight="900" fill="#a50f1a">福</text>`),
 lingote:V(`<path d="M16 82q34 14 68 0l-4-12q-30 8-60 0z" fill="url(#gP)" stroke="#3b1578" stroke-width="2"/><path d="M10 44q-4-12 10-14h60q14 2 10 14-6 28-26 30H36Q16 72 10 44z" fill="url(#gG)" stroke="#8a5a0a" stroke-width="3"/><ellipse cx="50" cy="38" rx="30" ry="8" fill="#fff0a0" stroke="#b9740f" stroke-width="2"/><path d="M26 52q4 12 14 14M74 52q-4 12-14 14" stroke="#fff6c0" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/>`),
 tigre:V(TIGER+HAT)
};
const sym=k=>k==='tigre'?SV.tigre+'<em>WILD</em>':SV[k];
$('mascot').innerHTML=V(TIGER+HAT);
let I,BETS=[],bi=0,busy=false,auto=false,turbo=false,saldo=0,grid=[],tm=[];
const bet=()=>BETS[bi];
async function api(p,b){const r=await fetch(p,b===undefined?{credentials:'same-origin'}:{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(r.status===401){location.href='/';return{ok:false}}return r.json()}
function draw(g,hits){const set=new Set();(hits||[]).forEach(h=>I.linhas[h.linha].forEach((row,c)=>set.add(c+'-'+row)));
 $('reels').className='reels'+(hits&&hits.length?' hasw':'');$('reels').innerHTML=g.map((col,c)=>`<div class="col" id="c${c}">${col.map((s,r)=>`<div class="cell ${set.has(c+'-'+r)?'win':''}">${sym(s)}</div>`).join('')}</div>`).join('');
 const on=new Set((hits||[]).map(h=>h.linha+1));document.querySelectorAll('.pil span').forEach(e=>e.classList.toggle('on',on.has(+e.textContent)))}
const rnd=()=>I.simbolos[Math.floor(Math.random()*7)];
function refresh(){$('cred').textContent=money(saldo);$('apo').textContent=money(bet())}
function step(d){if(busy)return;bi=Math.min(BETS.length-1,Math.max(0,bi+d));refresh()}
function toggleAuto(){auto=!auto;$('bA').classList.toggle('on',auto);if(auto&&!busy)spin()}
async function spin(){if(busy)return;busy=true;$('go').disabled=true;$('go').classList.add('run');$('err').textContent='';$('msg').textContent='Boa sorte!';$('ganho').textContent=money(0);draw(grid);
 const cols=[0,1,2];tm=cols.map(c=>{$('c'+c).classList.add('spin');return setInterval(()=>document.querySelectorAll('#c'+c+' .cell').forEach(e=>e.innerHTML=sym(rnd())),80)});
 const [res]=await Promise.all([api('/api/slots/tigre/spin',{valor:bet()}),sleep(turbo?300:750)]);
 if(!res.ok){tm.forEach(clearInterval);cols.forEach(c=>$('c'+c).classList.remove('spin'));$('err').textContent=res.msg||'Erro.';$('msg').textContent='Faça sua aposta, Tigre Dourado!';auto=false;$('bA').classList.remove('on');return fim()}
 grid=res.grid;for(const c of cols){await sleep(turbo?60:300);clearInterval(tm[c]);const el=$('c'+c);el.classList.remove('spin');el.classList.add('land');el.querySelectorAll('.cell').forEach((e,r)=>e.innerHTML=sym(grid[c][r]))}
 await sleep(280);draw(grid,res.linhas);saldo=res.saldo;$('cred').textContent=money(saldo);$('ganho').textContent=money(res.premio);
 $('msg').textContent=res.premio>0?'🎉 Ganhou '+money(res.premio)+'!':'Faça sua aposta, Tigre Dourado!';
 await sleep(res.premio>0?(turbo?600:1400):(turbo?80:300));fim()}
function fim(){busy=false;$('go').disabled=false;$('go').classList.remove('run');if(auto)spin()}
function showInfo(){$('sheet').innerHTML=`<button class="x" onclick="modal.classList.remove('on')">✕</button><h3>Tabela de prêmios</h3><p>5 linhas (3 retas e 2 diagonais, numeradas nas laterais). Junte 3 símbolos iguais na linha. O <b>Tigre</b> é curinga e substitui qualquer símbolo. O prêmio de cada linha é o multiplicador × (aposta ÷ 5).</p>`+
 I.simbolos.map((k,i)=>[k,i]).reverse().map(([k,i])=>`<div class="pr">${SV[k]}<span style="font-size:12px;opacity:.7">${k==='tigre'?'3 tigres (curinga)':'3 iguais'}</span><b>${I.pay[i]}x</b></div>`).join('')+`<p>Prêmio máximo limitado pela casa. Jogue com responsabilidade — +18.</p>`;$('modal').classList.add('on')}
(async()=>{I=await api('/api/slots/tigre/info');if(!I.ok)return;saldo=I.saldo;BETS=[1,2,5,10,20,50,100].filter(v=>v>=I.min&&v<=I.max);grid=Array.from({length:3},()=>Array.from({length:3},rnd));draw(grid);refresh()})();
</script></body></html>
