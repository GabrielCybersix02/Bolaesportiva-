<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Tigre Dourado • Bola Esportiva</title><meta name="theme-color" content="#9b1c1c">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%}body{font-family:Inter,system-ui,sans-serif;color:#fff;display:flex;justify-content:center;overflow-x:hidden;
 background:radial-gradient(circle at 15% 20%,#ff8fb355 0 14px,transparent 15px),radial-gradient(circle at 85% 35%,#ff8fb355 0 18px,transparent 19px),radial-gradient(circle at 70% 75%,#ff8fb344 0 12px,transparent 13px),
 linear-gradient(#5aa7e6 0,#f0a0a0 16%,#b3262e 17%,#8a1a22 55%,#6b6b78 56%,#55555f 100%)}
.app{width:100%;max-width:430px;min-height:100%;display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top,0px) 10px env(safe-area-inset-bottom,0px)}
.bar{width:100%;display:flex;justify-content:space-between;align-items:center;padding:8px 2px}.bar a{color:#fff;text-decoration:none;font-size:22px;font-weight:800}.pill{background:#00000055;border-radius:99px;padding:6px 14px;font-size:12px;font-weight:800}
.roof{width:96%;height:44px;margin-top:6px;background:repeating-linear-gradient(90deg,#0f7a3c 0 14px,#16a34a 14px 28px);border-radius:60% 60% 0 0/100% 100% 0 0;border-top:5px solid #fcd34d;position:relative}
.mascot{position:absolute;left:50%;top:-34px;transform:translateX(-50%);width:74px;height:74px;border-radius:50%;background:radial-gradient(#fde68a,#f59e0b);border:4px solid #b91c1c;display:grid;place-items:center;font-size:46px;box-shadow:0 6px 12px #0008}
.frame{width:100%;background:linear-gradient(#fcd34d,#b45309);padding:6px;border-radius:6px;display:flex;gap:4px;position:relative}
.pil{width:20px;background:linear-gradient(90deg,#b91c1c,#dc2626,#b91c1c);border-radius:3px;display:flex;flex-direction:column;justify-content:space-around;align-items:center;font-size:11px;font-weight:900;color:#fde68a}.pil span{opacity:.55;transition:.2s}.pil span.on{opacity:1;color:#fff;text-shadow:0 0 8px #fff;transform:scale(1.4)}
.reels{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:#7c2d12;padding:3px}
.col{display:grid;grid-template-rows:repeat(3,1fr);gap:3px;overflow:hidden}.cell{aspect-ratio:1;background:linear-gradient(#f5e6c8,#e8d2a4);display:grid;place-items:center;font-size:clamp(40px,14vw,60px);line-height:1;position:relative;transition:.2s}
.col.spin .cell{animation:fall .11s linear infinite;filter:blur(1.5px)}@keyframes fall{from{transform:translateY(-40%)}to{transform:translateY(40%)}}
.col.land .cell{animation:land .26s ease-out}@keyframes land{0%{transform:translateY(-70%)}60%{transform:translateY(7%)}100%{transform:none}}
.reels.hasw .cell{opacity:.4}.reels.hasw .cell.win{opacity:1;background:linear-gradient(#fff7c2,#fcd34d);box-shadow:inset 0 0 0 3px #f59e0b,0 0 14px #fbbf24;animation:pulse .5s infinite alternate;z-index:2}@keyframes pulse{to{transform:scale(1.07)}}
.cell em{position:absolute;bottom:3px;font-style:normal;font-family:'Lilita One',Impact,sans-serif;font-size:13px;letter-spacing:.5px;background:linear-gradient(#ef4444,#991b1b);color:#fde68a;padding:0 9px;border-radius:5px;border:1.5px solid #fcd34d}
.msg{width:100%;margin-top:8px;border:3px solid #fcd34d;border-radius:10px;background:linear-gradient(#b91c1c,#7f1d1d);text-align:center;padding:9px 6px;font-weight:900;color:#fde68a;font-size:16px;text-shadow:0 2px 0 #450a0a;min-height:44px}
.info{width:100%;display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px;margin-top:8px}.info div{background:#7f1d1d;border:2px solid #fcd34d;border-radius:9px;padding:5px 6px;text-align:center;font-weight:900;font-size:13px}.info small{display:block;font-size:9px;color:#fcd34d;font-weight:700;letter-spacing:.5px}
.ctl{width:100%;display:flex;align-items:center;justify-content:space-between;margin:12px 0 10px;gap:6px}
.sb{width:44px;height:44px;border-radius:50%;border:0;background:linear-gradient(#b91c1c,#7f1d1d);color:#fde68a;font-size:18px;font-weight:900;box-shadow:inset 0 0 0 2px #fcd34d}.sb.on{background:linear-gradient(#16a34a,#166534);color:#fff}
.go{width:92px;height:92px;border-radius:50%;border:5px solid #fcd34d;background:radial-gradient(circle at 35% 30%,#4ade80,#15803d);color:#fff;font-size:48px;box-shadow:0 0 0 3px #7f1d1d,0 8px 18px #0009;transition:transform .15s}.go:active{transform:scale(.93)}.go.run{animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}.go:disabled{opacity:.75}
.err{color:#fecaca;font-size:12px;font-weight:700;min-height:16px;text-align:center}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.on{display:flex}.sheet{background:#3b0a0a;border-top:3px solid #fcd34d;width:100%;max-width:430px;max-height:80vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px;font-size:13px}
.sheet h3{margin:0 0 8px;color:#fcd34d}.pr{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #ffffff18;font-size:22px}.pr b{margin-left:auto;font-size:14px}.x{float:right;background:#ffffff22;border:0;color:#fff;border-radius:99px;width:30px;height:30px}.sheet p{opacity:.8;line-height:1.4;font-size:12px}
</style></head><body><div class="app">
<div class="bar"><a href="/slots">‹</a><div class="pill">🐯 Tigre Dourado</div><a href="/carteira" class="pill" style="color:#fff;text-decoration:none">+ Depositar</a></div>
<div class="roof"><div class="mascot">🐯</div></div>
<div class="frame"><div class="pil" id="pl"><span>1</span><span>2</span><span>3</span></div><div class="reels" id="reels"></div><div class="pil" id="pr"><span>4</span><span>5</span><span>·</span></div></div>
<div class="msg" id="msg">Faça sua aposta, Tigre Dourado!</div>
<div class="info"><div><small>CRÉDITO</small><span id="cred">R$ 0,00</span></div><div><small>APOSTA</small><span id="apo">R$ 0,00</span></div><div><small>GANHO</small><span id="ganho">R$ 0,00</span></div></div>
<div class="err" id="err" style="margin-top:6px"></div>
<div class="ctl"><button class="sb" id="bT" onclick="turbo=!turbo;this.classList.toggle('on',turbo)">⚡</button><button class="sb" id="bA" onclick="toggleAuto()">⟳</button><button class="sb" onclick="step(-1)">−</button>
 <button class="go" id="go" onclick="spin()">↻</button><button class="sb" onclick="step(1)">+</button><button class="sb" onclick="showInfo()">☰</button></div>
</div>
<div class="modal" id="modal" onclick="if(event.target===this)this.classList.remove('on')"><div class="sheet" id="sheet"></div></div>
<script>
const $=i=>document.getElementById(i),money=v=>'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const EM={moeda:'🪙',tangerina:'🍊',lanterna:'🏮',bombinha:'🧨',envelope:'🧧',lingote:'💰',tigre:'🐯'};
const sym=k=>k==='tigre'?'🐯<em>WILD</em>':EM[k];
let I,BETS=[],bi=0,busy=false,auto=false,turbo=false,saldo=0,grid=[],tm=[];
const bet=()=>BETS[bi];
async function api(p,b){const r=await fetch(p,b===undefined?{credentials:'same-origin'}:{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(r.status===401){location.href='/';return{ok:false}}return r.json()}
function draw(g,hits){const set=new Set();(hits||[]).forEach(h=>I.linhas[h.linha].forEach((row,c)=>set.add(c+'-'+row)));
 $('reels').className='reels'+(hits&&hits.length?' hasw':'');$('reels').innerHTML=g.map((col,c)=>`<div class="col" id="c${c}">${col.map((s,r)=>`<div class="cell ${set.has(c+'-'+r)?'win':''}">${sym(s)}</div>`).join('')}</div>`).join('');
 const on=new Set((hits||[]).map(h=>h.linha+1));document.querySelectorAll('.pil span').forEach(e=>e.classList.toggle('on',on.has(+e.textContent)))}
const rnd=()=>I.simbolos[Math.floor(Math.random()*7)];
function refresh(){$('cred').textContent=money(saldo);$('apo').textContent=money(bet())}
function step(d){if(busy)return;bi=Math.min(BETS.length-1,Math.max(0,bi+d));refresh()}
function toggleAuto(){auto=!auto;$('bA').classList.toggle('on',auto);if(auto&&!busy)spin()}
async function spin(){if(busy)return;busy=true;$('go').disabled=true;$('go').classList.add('run');$('err').textContent='';$('msg').textContent='Boa sorte!';$('ganho').textContent=money(0);draw(grid);
 const cols=[0,1,2];tm=cols.map(c=>{$('c'+c).classList.add('spin');return setInterval(()=>document.querySelectorAll('#c'+c+' .cell').forEach(e=>e.innerHTML=sym(rnd())),70)});
 const [res]=await Promise.all([api('/api/slots/tigre/spin',{valor:bet()}),sleep(turbo?300:750)]);
 if(!res.ok){tm.forEach(clearInterval);cols.forEach(c=>$('c'+c).classList.remove('spin'));$('err').textContent=res.msg||'Erro.';$('msg').textContent='Faça sua aposta, Tigre Dourado!';auto=false;$('bA').classList.remove('on');return fim()}
 grid=res.grid;for(const c of cols){await sleep(turbo?60:300);clearInterval(tm[c]);const el=$('c'+c);el.classList.remove('spin');el.classList.add('land');el.querySelectorAll('.cell').forEach((e,r)=>e.innerHTML=sym(grid[c][r]))}
 await sleep(280);draw(grid,res.linhas);saldo=res.saldo;$('cred').textContent=money(saldo);$('ganho').textContent=money(res.premio);
 $('msg').textContent=res.premio>0?'🎉 Ganhou '+money(res.premio)+'!':'Faça sua aposta, Tigre Dourado!';
 await sleep(res.premio>0?(turbo?600:1400):(turbo?80:300));fim()}
function fim(){busy=false;$('go').disabled=false;$('go').classList.remove('run');if(auto)spin()}
function showInfo(){$('sheet').innerHTML=`<button class="x" onclick="modal.classList.remove('on')">✕</button><h3>Tabela de prêmios</h3><p>5 linhas (3 retas e 2 diagonais, numeradas nas laterais). Junte 3 símbolos iguais na linha. O <b>🐯 Tigre</b> é curinga e substitui qualquer símbolo. O prêmio de cada linha é o multiplicador × (aposta ÷ 5).</p>`+
 I.simbolos.map((k,i)=>[k,i]).reverse().map(([k,i])=>`<div class="pr"><span>${EM[k]}</span><span style="font-size:12px;opacity:.7">${k==='tigre'?'3 tigres (curinga)':'3 iguais'}</span><b>${I.pay[i]}x</b></div>`).join('')+`<p>Prêmio máximo limitado pela casa. Jogue com responsabilidade — +18.</p>`;$('modal').classList.add('on')}
(async()=>{I=await api('/api/slots/tigre/info');if(!I.ok)return;saldo=I.saldo;BETS=[1,2,5,10,20,50,100].filter(v=>v>=I.min&&v<=I.max);grid=Array.from({length:3},()=>Array.from({length:3},rnd));draw(grid);refresh()})();
</script></body></html>
