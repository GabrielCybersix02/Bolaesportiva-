<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Slots • Bola Esportiva</title><meta name="theme-color" content="#1445C7">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#EEF3FB;color:#111;min-height:100vh}
header{background:linear-gradient(135deg,#2F6BFF,#1445C7);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header a{color:#fff;text-decoration:none;font-weight:800}.saldo{font-weight:900}.saldo small{display:block;font-size:10px;opacity:.8;font-weight:700;text-align:right}
main{max-width:430px;margin:0 auto;padding:14px}h2{margin:4px 0 2px;font-size:18px}.sub{font-size:12px;color:#666;margin-bottom:10px}
.machine{background:linear-gradient(160deg,#0A1F4F,#1445C7);border-radius:18px;padding:14px;box-shadow:0 14px 28px -14px rgba(20,69,199,.8)}
.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#06143a;padding:8px;border-radius:12px}
.reel{display:grid;gap:6px}.cell{background:#fff;border-radius:10px;height:72px;display:flex;align-items:center;justify-content:center;font-size:38px;transition:.15s}
.cell.win{background:#FACC15;transform:scale(1.06);box-shadow:0 0 14px #FACC15}.reel.spin .cell{filter:blur(2px)}
.win-msg{height:26px;text-align:center;color:#FACC15;font-weight:900;margin:8px 0 2px}
.bet{display:flex;gap:6px;margin:8px 0}.bet button{flex:1;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);color:#fff;border-radius:9999px;padding:8px 0;font-weight:800}
.bet button.on{background:#fff;color:#1445C7}
.go{width:100%;border:0;border-radius:12px;padding:16px;font-size:18px;font-weight:900;background:#FACC15;color:#0A1F4F;box-shadow:0 4px 0 #b8940c}.go:disabled{opacity:.6}
.box{background:#fff;border-radius:14px;padding:12px;margin-top:12px;font-size:13px}.box h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;color:#1445C7}
.row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #eef}.pos{color:#059669;font-weight:800}.neg{color:#dc2626;font-weight:800}
.err{color:#dc2626;font-weight:700;text-align:center;min-height:18px;font-size:13px;margin-top:6px}
</style></head><body>
<header><a href="/">← Voltar</a><div class="saldo"><small>SALDO</small><span id="saldo">R$ 0,00</span></div></header>
<main>
<h2 id="nome">Slots</h2><div class="sub" id="sub"></div>
<div class="machine">
  <div class="reels" id="reels"></div>
  <div class="win-msg" id="msg"></div>
  <div class="bet" id="chips"></div>
  <button class="go" id="go" onclick="spin()">GIRAR</button>
</div>
<div class="err" id="err"></div>
<div class="box"><h3>Tabela de prêmios (3 iguais na linha)</h3><div id="pay"></div><div class="sub" style="margin:8px 0 0">5 linhas: 3 retas e 2 diagonais. O prêmio de cada linha é (multiplicador × aposta ÷ 5).</div></div>
<div class="box"><h3>Últimos giros</h3><div id="hist"></div></div>
</main>
<script>
const LINES=[[0,0,0],[1,1,1],[2,2,2],[0,1,2],[2,1,0]]; let G,KEY,BET=1,busy=false;
const $=i=>document.getElementById(i), money=v=>'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
async function api(p,b){const r=await fetch(p,b===undefined?{credentials:'same-origin'}:{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
  if(r.status===401){location.href='/';return {ok:false}} return r.json()}
function draw(grid){$('reels').innerHTML=grid.map((col,c)=>`<div class="reel" id="r${c}">${col.map((s,r)=>`<div class="cell" id="c${c}${r}">${s}</div>`).join('')}</div>`).join('')}
function renderHist(h){$('hist').innerHTML=h.length?h.map(x=>{const d=x.premio-x.aposta;return `<div class="row"><span>${money(x.aposta)}</span><span class="${d>=0?'pos':'neg'}">${d>=0?'+':''}${money(d)}</span></div>`}).join(''):'<div class="sub">Nenhum giro ainda.</div>'}
async function init(){const r=await api('/api/slots'); if(!r.ok)return; KEY=Object.keys(r.jogos)[0]; G=r.jogos[KEY];
  $('nome').textContent=G.nome; $('sub').textContent=G.sub; $('saldo').textContent=money(r.saldo);
  draw([0,1,2].map(()=>G.symbols.slice(0,3))); renderHist(r.historico);
  $('pay').innerHTML=Object.entries(G.pay).map(([s,m])=>`<div class="row"><span>${s} ${s} ${s}</span><b>${m}x</b></div>`).join('');
  const opts=[1,2,5,10,20].filter(v=>v>=G.min&&v<=G.max); BET=opts[0];
  $('chips').innerHTML=opts.map(v=>`<button data-v="${v}" onclick="setBet(${v})">${v}</button>`).join(''); setBet(BET)}
function setBet(v){BET=v;document.querySelectorAll('#chips button').forEach(b=>b.classList.toggle('on',+b.dataset.v===v))}
async function spin(){ if(busy)return; busy=true; $('go').disabled=true; $('err').textContent=''; $('msg').textContent='';
  document.querySelectorAll('.cell').forEach(c=>c.classList.remove('win'));
  const timers=[0,1,2].map(c=>{$('r'+c).classList.add('spin');return setInterval(()=>{for(let r=0;r<3;r++)$('c'+c+r).textContent=G.symbols[Math.floor(Math.random()*G.symbols.length)]},70)});
  const [res]=await Promise.all([api('/api/slots/'+KEY+'/spin',{valor:BET}),new Promise(r=>setTimeout(r,700))]);
  if(!res.ok){timers.forEach(clearInterval);document.querySelectorAll('.reel').forEach(e=>e.classList.remove('spin'));$('err').textContent=res.msg||'Erro.';busy=false;$('go').disabled=false;return}
  for(let c=0;c<3;c++){await new Promise(r=>setTimeout(r,350)); clearInterval(timers[c]); $('r'+c).classList.remove('spin'); res.grid[c].forEach((s,r)=>$('c'+c+r).textContent=s)}
  res.linhas.forEach(i=>LINES[i].forEach((row,c)=>$('c'+c+row).classList.add('win')));
  $('msg').textContent=res.premio>0?'🎉 Você ganhou '+money(res.premio)+'!':''; $('saldo').textContent=money(res.saldo);
  const h=await api('/api/slots'); if(h.ok) renderHist(h.historico); busy=false; $('go').disabled=false}
init();
</script></body></html>
